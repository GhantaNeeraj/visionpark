services:
  - type: web
    name: visionpark-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from ultralytics import YOLO; YOLO('yolo11n.pt')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: YOLO_MODEL
        value: yolo11n.pt
      - key: CORS_ORIGINS
        sync: false
